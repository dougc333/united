<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Parent Document Retriever</title>
  <desc>Documents are split into large parent chunks, which are stored by id in a docstore, and each parent is split into small child chunks that are embedded into a vector DB. The user query retrieves the small chunks, their parent ids are looked up in the docstore, and the corresponding parent chunks are given to the LLM as context.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .amber text { fill: #633806; }
    .blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .blue text { fill: #0C447C; }
    .it { font-size: 12px; font-style: italic; }
    .tq { font-size: 13px; font-weight: 500; }
    .sn { font-size: 12px; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .amber rect { fill: #633806; stroke: #EF9F27; }
      .amber text { fill: #FAEEDA; }
      .blue rect { fill: #0C447C; stroke: #85B7EB; }
      .blue text { fill: #E6F1FB; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="520"/>

  <!-- Indexing: documents -> parents -> children -> vector DB -->
  <g class="gray"><rect x="16" y="236" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="61" y="258" text-anchor="middle" dominant-baseline="central">Documents</text></g>
  <path d="M108 258 L136 258" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="61" y="296" text-anchor="middle" dominant-baseline="central">parent splitter</text>
  <rect class="group" x="140" y="96" width="100" height="320" rx="10"/>
  <text class="ts" x="190" y="110" text-anchor="middle" dominant-baseline="central">Parents</text>
  <g class="teal"><rect x="150" y="124" width="80" height="70" rx="8" stroke-width="0.5"/><text class="th" x="190" y="159" text-anchor="middle" dominant-baseline="central">P1</text></g>
  <g class="amber"><rect x="150" y="330" width="80" height="70" rx="8" stroke-width="0.5"/><text class="th" x="190" y="365" text-anchor="middle" dominant-baseline="central">P2</text></g>
  <text class="ts" x="335" y="88" text-anchor="middle" dominant-baseline="central">children</text>
  <g class="teal"><rect x="300" y="102" width="70" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="335" y="116" text-anchor="middle" dominant-baseline="central">P1-c1</text></g>
  <path d="M232 159 L296 116" class="arr" marker-end="url(#arrow)"/>
  <path d="M372 116 L466 236" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="300" y="144" width="70" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="335" y="158" text-anchor="middle" dominant-baseline="central">P1-c2</text></g>
  <path d="M232 159 L296 158" class="arr" marker-end="url(#arrow)"/>
  <path d="M372 158 L466 245" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="300" y="186" width="70" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="335" y="200" text-anchor="middle" dominant-baseline="central">P1-c3</text></g>
  <path d="M232 159 L296 200" class="arr" marker-end="url(#arrow)"/>
  <path d="M372 200 L466 254" class="arr" marker-end="url(#arrow)"/>
  <g class="amber"><rect x="300" y="308" width="70" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="335" y="322" text-anchor="middle" dominant-baseline="central">P2-c1</text></g>
  <path d="M232 365 L296 322" class="arr" marker-end="url(#arrow)"/>
  <path d="M372 322 L466 263" class="arr" marker-end="url(#arrow)"/>
  <g class="amber"><rect x="300" y="350" width="70" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="335" y="364" text-anchor="middle" dominant-baseline="central">P2-c2</text></g>
  <path d="M232 365 L296 364" class="arr" marker-end="url(#arrow)"/>
  <path d="M372 364 L466 272" class="arr" marker-end="url(#arrow)"/>
  <g class="amber"><rect x="300" y="392" width="70" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="335" y="406" text-anchor="middle" dominant-baseline="central">P2-c3</text></g>
  <path d="M232 365 L296 406" class="arr" marker-end="url(#arrow)"/>
  <path d="M372 406 L466 281" class="arr" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="470" y="222" width="100" height="72" rx="8" stroke-width="0.5"/><text class="th" x="520" y="249" text-anchor="middle" dominant-baseline="central">Vector DB</text><text class="ts" x="520" y="268" text-anchor="middle" dominant-baseline="central">child chunks</text></g>

  <!-- Query and retrieval -->
  <g class="coral"><rect x="780" y="40" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="830" y="62" text-anchor="middle" dominant-baseline="central">User query</text></g>
  <path d="M778 62 L520 62 L520 218" class="arr" marker-end="url(#arrow)"/>
  <rect class="group" x="445" y="336" width="150" height="56" rx="10"/>
  <g class="teal"><rect x="451" y="350" width="42" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="472" y="364" text-anchor="middle" dominant-baseline="central">P1-c2</text></g>
  <g class="amber"><rect x="499" y="350" width="42" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="520" y="364" text-anchor="middle" dominant-baseline="central">P2-c1</text></g>
  <g class="amber"><rect x="547" y="350" width="42" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="568" y="364" text-anchor="middle" dominant-baseline="central">P2-c3</text></g>
  <text class="ts" x="520" y="406" text-anchor="middle" dominant-baseline="central">small chunks retrieved</text>
  <path d="M520 296 L520 332" class="arr" marker-end="url(#arrow)"/>

  <!-- Parent lookup -->
  <g class="purple"><rect x="620" y="336" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="675" y="355" text-anchor="middle" dominant-baseline="central">Docstore</text><text class="ts" x="675" y="374" text-anchor="middle" dominant-baseline="central">id → parent</text></g>
  <path d="M597 364 L616 364" class="arr" marker-end="url(#arrow)"/>
  <path d="M190 418 L190 470 L675 470 L675 396" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="432" y="458" text-anchor="middle" dominant-baseline="central">parents stored by id</text>
  <rect class="group" x="760" y="336" width="140" height="56" rx="10"/>
  <g class="teal"><rect x="770" y="350" width="54" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="797" y="364" text-anchor="middle" dominant-baseline="central">P1</text></g>
  <g class="amber"><rect x="836" y="350" width="54" height="28" rx="8" stroke-width="0.5"/><text class="sn" x="863" y="364" text-anchor="middle" dominant-baseline="central">P2</text></g>
  <text class="ts" x="830" y="406" text-anchor="middle" dominant-baseline="central">parent chunks as context</text>
  <path d="M732 364 L756 364" class="arr" marker-end="url(#arrow)"/>

  <!-- Generation -->
  <g class="coral"><rect x="790" y="236" width="80" height="44" rx="8" stroke-width="0.5"/><text class="th" x="830" y="258" text-anchor="middle" dominant-baseline="central">LLM</text></g>
  <path d="M830 334 L830 284" class="arr" marker-end="url(#arrow)"/>
  <path d="M830 86 L830 232" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="650" y="236" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="700" y="258" text-anchor="middle" dominant-baseline="central">Response</text></g>
  <path d="M788 258 L754 258" class="arr" marker-end="url(#arrow)"/>

  <text class="label" x="16" y="504">Parent Document Retriever</text>
</svg>
