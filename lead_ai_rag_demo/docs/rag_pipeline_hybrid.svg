<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>RAG with Reranking and Postgres</title>
  <desc>Documents are chunked, embedded, and stored in a vector DB. A user's query is embedded with the same model and searched against the vector DB. PostgreSQL full-text search adds more chunks. The combined relevant chunks and the query go into a reranking model, which keeps a smaller set of reranked chunks. The reranked chunks and the query (context) go to the LLM, whose output returns to the user.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="600"/>

  <!-- Knowledge-base creation -->
  <g class="teal"><rect x="16" y="186" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="61" y="208" text-anchor="middle" dominant-baseline="central">Documents</text></g>
  <g class="teal"><rect x="130" y="186" width="88" height="44" rx="8" stroke-width="0.5"/><text class="th" x="174" y="208" text-anchor="middle" dominant-baseline="central">Chunking</text></g>
  <g class="teal"><rect x="242" y="186" width="92" height="44" rx="8" stroke-width="0.5"/><text class="th" x="288" y="208" text-anchor="middle" dominant-baseline="central">Embedding</text></g>
  <g class="teal"><rect x="358" y="170" width="92" height="76" rx="8" stroke-width="0.5"/><text class="th" x="404" y="208" text-anchor="middle" dominant-baseline="central">Vector DB</text></g>
  <line x1="108" y1="208" x2="126" y2="208" class="arr" marker-end="url(#arrow)"/>
  <line x1="220" y1="208" x2="238" y2="208" class="arr" marker-end="url(#arrow)"/>
  <line x1="336" y1="208" x2="354" y2="208" class="arr" marker-end="url(#arrow)"/>

  <!-- Shared embedding model -->
  <g class="gray"><rect x="316" y="36" width="144" height="44" rx="8" stroke-width="0.5"/><text class="th" x="388" y="58" text-anchor="middle" dominant-baseline="central">Embedding model</text></g>
  <path d="M314 58 L288 58 L288 182" class="arr" marker-end="url(#arrow)"/>
  <path d="M420 82 L420 148 L474 148" class="arr" marker-end="url(#arrow)"/>

  <!-- Query path -->
  <g class="fig"><circle cx="870" cy="44" r="9"/><line x1="870" y1="53" x2="870" y2="80"/><line x1="854" y1="64" x2="886" y2="64"/><line x1="870" y1="80" x2="858" y2="100"/><line x1="870" y1="80" x2="882" y2="100"/></g>
  <g class="coral"><rect x="478" y="46" width="92" height="44" rx="8" stroke-width="0.5"/><text class="th" x="524" y="68" text-anchor="middle" dominant-baseline="central">Query</text></g>
  <g class="coral"><rect x="478" y="126" width="92" height="44" rx="8" stroke-width="0.5"/><text class="th" x="524" y="148" text-anchor="middle" dominant-baseline="central">Embedding</text></g>
  <line x1="848" y1="68" x2="574" y2="68" class="arr" marker-end="url(#arrow)"/>
  <line x1="524" y1="92" x2="524" y2="122" class="arr" marker-end="url(#arrow)"/>
  <path d="M524 172 L524 208 L454 208" class="arr" marker-end="url(#arrow)"/>

  <!-- Retrieved top-k chunks: teal/coral from vector DB, purple from PostgreSQL -->
  <rect class="group" x="370" y="282" width="110" height="240" rx="10"/>
  <g class="teal"><rect x="380" y="292" width="90" height="30" rx="8" stroke-width="0.5"/><text class="th" x="425" y="307" text-anchor="middle" dominant-baseline="central">Chunk-1</text></g>
  <g class="coral"><rect x="380" y="330" width="90" height="30" rx="8" stroke-width="1"/><text class="th" x="425" y="345" text-anchor="middle" dominant-baseline="central">Chunk-2</text></g>
  <g class="teal"><rect x="380" y="368" width="90" height="30" rx="8" stroke-width="0.5"/><text class="th" x="425" y="383" text-anchor="middle" dominant-baseline="central">Chunk-3</text></g>
  <g class="coral"><rect x="380" y="406" width="90" height="30" rx="8" stroke-width="1"/><text class="th" x="425" y="421" text-anchor="middle" dominant-baseline="central">Chunk-4</text></g>
  <g class="purple"><rect x="380" y="444" width="90" height="30" rx="8" stroke-width="1"/><text class="th" x="425" y="459" text-anchor="middle" dominant-baseline="central">Chunk-5</text></g>
  <g class="purple"><rect x="380" y="482" width="90" height="30" rx="8" stroke-width="0.5"/><text class="th" x="425" y="497" text-anchor="middle" dominant-baseline="central">Chunk-6</text></g>
  <text class="ts" x="425" y="538" text-anchor="middle" dominant-baseline="central">relevant chunks (top-k)</text>
  <line x1="404" y1="248" x2="404" y2="278" class="arr" marker-end="url(#arrow)"/>

  <!-- PostgreSQL retrieval -->
  <g class="purple"><rect x="200" y="450" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="265" y="469" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts2" x="265" y="489" text-anchor="middle" dominant-baseline="central">full-text search</text></g>
  <line x1="332" y1="478" x2="366" y2="478" class="arr" marker-end="url(#arrow)"/>

  <!-- Reranking -->
  <g class="gray"><rect x="520" y="374" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="585" y="402" text-anchor="middle" dominant-baseline="central">Reranking model</text></g>
  <line x1="472" y1="307" x2="516" y2="382" class="arr" marker-end="url(#arrow)"/>
  <line x1="472" y1="345" x2="516" y2="390" class="arr" marker-end="url(#arrow)"/>
  <line x1="472" y1="383" x2="516" y2="398" class="arr" marker-end="url(#arrow)"/>
  <line x1="472" y1="421" x2="516" y2="406" class="arr" marker-end="url(#arrow)"/>
  <line x1="472" y1="459" x2="516" y2="414" class="arr" marker-end="url(#arrow)"/>
  <line x1="472" y1="497" x2="516" y2="422" class="arr" marker-end="url(#arrow)"/>
  <g class="coral"><rect x="535" y="468" width="100" height="36" rx="8" stroke-width="0.5"/><text class="th" x="585" y="486" text-anchor="middle" dominant-baseline="central">Query</text></g>
  <line x1="585" y1="466" x2="585" y2="434" class="arr" marker-end="url(#arrow)"/>

  <rect class="group" x="680" y="339" width="110" height="126" rx="10"/>
  <g class="coral"><rect x="690" y="349" width="90" height="30" rx="8" stroke-width="1"/><text class="th" x="735" y="364" text-anchor="middle" dominant-baseline="central">Chunk-2</text></g>
  <g class="coral"><rect x="690" y="387" width="90" height="30" rx="8" stroke-width="1"/><text class="th" x="735" y="402" text-anchor="middle" dominant-baseline="central">Chunk-4</text></g>
  <g class="purple"><rect x="690" y="425" width="90" height="30" rx="8" stroke-width="1"/><text class="th" x="735" y="440" text-anchor="middle" dominant-baseline="central">Chunk-5</text></g>
  <text class="ts" x="735" y="481" text-anchor="middle" dominant-baseline="central">top-n kept</text>
  <line x1="652" y1="402" x2="676" y2="402" class="arr" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="820" y="374" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="870" y="393" text-anchor="middle" dominant-baseline="central">Reranked</text><text class="th" x="870" y="411" text-anchor="middle" dominant-baseline="central">chunks</text></g>
  <line x1="792" y1="402" x2="816" y2="402" class="arr" marker-end="url(#arrow)"/>

  <!-- Generation -->
  <g class="coral"><rect x="830" y="250" width="80" height="44" rx="8" stroke-width="0.5"/><text class="th" x="870" y="272" text-anchor="middle" dominant-baseline="central">LLM</text></g>
  <line x1="870" y1="372" x2="870" y2="298" class="arr" marker-end="url(#arrow)"/>
  <path d="M572 84 L800 84 L800 272 L826 272" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="806" y="180" dominant-baseline="central">context</text>
  <line x1="870" y1="248" x2="870" y2="106" class="arr" marker-end="url(#arrow)"/>

  <text class="label" x="16" y="578">RAG with Reranking and Postgres</text>
</svg>
