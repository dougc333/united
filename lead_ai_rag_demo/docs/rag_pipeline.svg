<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Simple RAG pipeline</title>
  <desc>Documents are chunked, embedded, and stored in a vector DB. A user's query is embedded and searched against the vector DB; relevant chunks go to the LLM along with the query as context, and the LLM's output returns to the user.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="340"/>

  <!-- Knowledge-base creation -->
  <g class="teal"><rect x="16" y="186" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="61" y="208" text-anchor="middle" dominant-baseline="central">Documents</text></g>
  <g class="teal"><rect x="130" y="186" width="88" height="44" rx="8" stroke-width="0.5"/><text class="th" x="174" y="208" text-anchor="middle" dominant-baseline="central">Chunking</text></g>
  <g class="teal"><rect x="242" y="186" width="92" height="44" rx="8" stroke-width="0.5"/><text class="th" x="288" y="208" text-anchor="middle" dominant-baseline="central">Embedding</text></g>
  <g class="teal"><rect x="358" y="170" width="92" height="76" rx="8" stroke-width="0.5"/><text class="th" x="404" y="208" text-anchor="middle" dominant-baseline="central">Vector DB</text></g>
  <line x1="108" y1="208" x2="126" y2="208" class="arr" marker-end="url(#arrow)"/>
  <line x1="220" y1="208" x2="238" y2="208" class="arr" marker-end="url(#arrow)"/>
  <line x1="336" y1="208" x2="354" y2="208" class="arr" marker-end="url(#arrow)"/>

  <!-- Shared embedding model -->
  <g class="gray"><rect x="316" y="36" width="144" height="44" rx="8" stroke-width="0.5"/><text class="th" x="388" y="58" text-anchor="middle" dominant-baseline="central">Embedding model</text></g>
  <path d="M314 58 L288 58 L288 182" class="arr" marker-end="url(#arrow)"/>
  <path d="M420 82 L420 148 L474 148" class="arr" marker-end="url(#arrow)"/>

  <!-- User interaction -->
  <g class="fig"><circle cx="632" cy="44" r="9"/><line x1="632" y1="53" x2="632" y2="80"/><line x1="616" y1="64" x2="648" y2="64"/><line x1="632" y1="80" x2="620" y2="100"/><line x1="632" y1="80" x2="644" y2="100"/></g>
  <g class="coral"><rect x="478" y="46" width="92" height="44" rx="8" stroke-width="0.5"/><text class="th" x="524" y="68" text-anchor="middle" dominant-baseline="central">Query</text></g>
  <g class="coral"><rect x="478" y="126" width="92" height="44" rx="8" stroke-width="0.5"/><text class="th" x="524" y="148" text-anchor="middle" dominant-baseline="central">Embedding</text></g>
  <g class="coral"><rect x="478" y="264" width="92" height="56" rx="8" stroke-width="0.5"/><text class="th" x="524" y="283" text-anchor="middle" dominant-baseline="central">Relevant</text><text class="th" x="524" y="301" text-anchor="middle" dominant-baseline="central">chunks</text></g>
  <g class="coral"><rect x="590" y="270" width="74" height="44" rx="8" stroke-width="0.5"/><text class="th" x="627" y="292" text-anchor="middle" dominant-baseline="central">LLM</text></g>
  <line x1="610" y1="68" x2="574" y2="68" class="arr" marker-end="url(#arrow)"/>
  <line x1="524" y1="92" x2="524" y2="122" class="arr" marker-end="url(#arrow)"/>
  <path d="M524 172 L524 208 L454 208" class="arr" marker-end="url(#arrow)"/>
  <path d="M404 248 L404 292 L474 292" class="arr" marker-end="url(#arrow)"/>
  <line x1="572" y1="292" x2="586" y2="292" class="arr" marker-end="url(#arrow)"/>
  <path d="M572 82 L600 82 L600 266" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="594" y="220" text-anchor="end" dominant-baseline="central">context</text>
  <line x1="646" y1="268" x2="646" y2="106" class="arr" marker-end="url(#arrow)"/>
  <text class="label" x="16" y="318">Naive RAG</text>
</svg>
