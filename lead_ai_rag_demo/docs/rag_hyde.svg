<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>HyDE, Hypothetical Document Embeddings (2022)</title>
  <desc>Standard RAG searches for relevant chunks using the query directly. HyDE first has an LLM write a hypothetical answer from its own knowledge, then embeds that answer and uses it to search for documents.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="420"/>

  <text class="th" x="180" y="36" text-anchor="middle" dominant-baseline="central">Standard RAG</text>
  <text class="th" x="480" y="36" text-anchor="middle" dominant-baseline="central">HyDE</text>

  <!-- Standard RAG -->
  <g class="teal"><rect x="120" y="60" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="180" y="82" text-anchor="middle" dominant-baseline="central">Query</text></g>
  <g class="teal"><rect x="70" y="183" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="202" text-anchor="middle" dominant-baseline="central">Search for relevant</text><text class="th" x="180" y="220" text-anchor="middle" dominant-baseline="central">documents / chunks</text></g>
  <g class="teal"><rect x="120" y="306" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="180" y="328" text-anchor="middle" dominant-baseline="central">Results</text></g>
  <line x1="180" y1="106" x2="180" y2="179" class="arr" marker-end="url(#arrow)"/>
  <line x1="180" y1="241" x2="180" y2="302" class="arr" marker-end="url(#arrow)"/>

  <!-- HyDE -->
  <g class="teal"><rect x="420" y="60" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="480" y="82" text-anchor="middle" dominant-baseline="central">Query</text></g>
  <g class="purple"><rect x="370" y="134" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="480" y="153" text-anchor="middle" dominant-baseline="central">LLM generates a</text><text class="th" x="480" y="171" text-anchor="middle" dominant-baseline="central">hypothetical answer</text></g>
  <g class="purple"><rect x="370" y="220" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="480" y="239" text-anchor="middle" dominant-baseline="central">Embed the answer and</text><text class="th" x="480" y="257" text-anchor="middle" dominant-baseline="central">search for documents</text></g>
  <g class="teal"><rect x="420" y="306" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="480" y="328" text-anchor="middle" dominant-baseline="central">Results</text></g>
  <line x1="480" y1="106" x2="480" y2="130" class="arr" marker-end="url(#arrow)"/>
  <line x1="480" y1="192" x2="480" y2="216" class="arr" marker-end="url(#arrow)"/>
  <line x1="480" y1="278" x2="480" y2="302" class="arr" marker-end="url(#arrow)"/>

  <text class="label" x="16" y="400">HyDE, Hypothetical Document Embeddings (2022)</text>
</svg>
