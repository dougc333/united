<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="0 0 940 450" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>RAG with Query Expansion</title>
  <desc>Query expansion / multi-query retrieval: an LLM rewrites the original query into several generated queries. The retriever runs each against the vector DB built from the documents, the results are merged by set union into the relevant context, and the original query plus that context go to an LLM that produces the response.</desc>
  <style>
    .bg { fill: #ffffff; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal text { fill: #085041; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; }
    .coral text { fill: #712B13; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray text { fill: #444441; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple text { fill: #3C3489; }
    .purple .ts2 { font-size: 12px; fill: #534AB7; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr, .fig { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .fig { stroke: #2C2C2A; stroke-linecap: round; }
    .group { stroke: #888780; stroke-width: 0.75; fill: none; stroke-dasharray: 4 3; }
    .label { font-size: 24px; font-weight: 700; fill: #2C2C2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1e1c; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal text { fill: #E1F5EE; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral text { fill: #FAECE7; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray text { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple text { fill: #EEEDFE; }
      .purple .ts2 { fill: #CECBF6; }
      .ts { fill: #B4B2A9; }
      .arr { stroke: #B4B2A9; }
      .fig { stroke: #F1EFE8; }
      .label { fill: #F1EFE8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="450"/>

  <!-- Query expansion -->
  <g class="coral"><rect x="16" y="172" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="66" y="191" text-anchor="middle" dominant-baseline="central">Original</text><text class="th" x="66" y="209" text-anchor="middle" dominant-baseline="central">query</text></g>
  <g class="coral"><rect x="146" y="155" width="70" height="90" rx="8" stroke-width="0.5"/><text class="th" x="181" y="200" text-anchor="middle" dominant-baseline="central">LLM</text></g>
  <line x1="118" y1="200" x2="142" y2="200" class="arr" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="250" y="110" width="150" height="30" rx="8" stroke-width="0.75"/><text class="th" x="325" y="125" text-anchor="middle" dominant-baseline="central">Generated query 1</text></g>
  <line x1="218" y1="200" x2="246" y2="125" class="arr" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="250" y="158" width="150" height="30" rx="8" stroke-width="0.75"/><text class="th" x="325" y="173" text-anchor="middle" dominant-baseline="central">Generated query 2</text></g>
  <line x1="218" y1="200" x2="246" y2="173" class="arr" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="250" y="206" width="150" height="30" rx="8" stroke-width="0.75"/><text class="th" x="325" y="221" text-anchor="middle" dominant-baseline="central">Generated query 3</text></g>
  <line x1="218" y1="200" x2="246" y2="221" class="arr" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="250" y="254" width="150" height="30" rx="8" stroke-width="0.75"/><text class="th" x="325" y="269" text-anchor="middle" dominant-baseline="central">Generated query 4</text></g>
  <line x1="218" y1="200" x2="246" y2="269" class="arr" marker-end="url(#arrow)"/>

  <!-- Retrieval -->
  <g class="gray"><rect x="470" y="60" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="530" y="82" text-anchor="middle" dominant-baseline="central">Retriever</text></g>
  <line x1="402" y1="125" x2="466" y2="72" class="arr" marker-end="url(#arrow)"/>
  <line x1="402" y1="173" x2="466" y2="79" class="arr" marker-end="url(#arrow)"/>
  <line x1="402" y1="221" x2="466" y2="86" class="arr" marker-end="url(#arrow)"/>
  <line x1="402" y1="269" x2="466" y2="93" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="484" y="200" width="92" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="228" text-anchor="middle" dominant-baseline="central">Vector DB</text></g>
  <line x1="530" y1="198" x2="530" y2="108" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="485" y="300" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="530" y="322" text-anchor="middle" dominant-baseline="central">Documents</text></g>
  <line x1="530" y1="298" x2="530" y2="260" class="arr" marker-end="url(#arrow)"/>

  <!-- Merge and generate -->
  <g class="gray"><rect x="630" y="60" width="100" height="44" rx="22" stroke-width="0.5"/><text class="th" x="680" y="82" text-anchor="middle" dominant-baseline="central">Set union</text></g>
  <line x1="592" y1="82" x2="626" y2="82" class="arr" marker-end="url(#arrow)"/>
  <g class="teal"><rect x="620" y="172" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="680" y="191" text-anchor="middle" dominant-baseline="central">Relevant</text><text class="th" x="680" y="209" text-anchor="middle" dominant-baseline="central">context</text></g>
  <line x1="680" y1="106" x2="680" y2="168" class="arr" marker-end="url(#arrow)"/>
  <g class="coral"><rect x="770" y="155" width="60" height="90" rx="8" stroke-width="0.5"/><text class="th" x="800" y="200" text-anchor="middle" dominant-baseline="central">LLM</text></g>
  <line x1="742" y1="200" x2="766" y2="200" class="arr" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="850" y="178" width="84" height="44" rx="8" stroke-width="0.5"/><text class="th" x="892" y="200" text-anchor="middle" dominant-baseline="central">Response</text></g>
  <line x1="832" y1="200" x2="846" y2="200" class="arr" marker-end="url(#arrow)"/>
  <path d="M66 230 L66 390 L680 390 L680 232" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="300" y="378" text-anchor="middle" dominant-baseline="central">original query</text>

  <text class="label" x="16" y="434">RAG with Query Expansion</text>
</svg>
